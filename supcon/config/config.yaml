      "4":
        approach_pose: null
        place_pose: null
        retreat_pose: null
  observe_vel: 0.15
  fine_vel: 0.05
  preflight: true

task3:
  # ★ 手眼/TCP 标定结果。04 标定脚本会写 T_eef_camera；抓取前还必须人工填 T_eef_tcp。
  calibration:
    T_eef_camera: null
    T_eef_tcp: null
    note: "未完成标定"
  # ★ 视觉参数、抓取手型和各形状安放槽示教位姿。
  scene:
    intrinsics:
      fx: 0
      fy: 0
      cx: 0
      cy: 0
    observe_pose:                         # ★ 已采集：Task3 全局观察位（config/pose.txt）
      x: -0.509
      y: 0.215
      z: 0.681
      roll: -0.025
      pitch: 0.086
      yaw: 0.031
    perception:
      workspace_roi: [0, 0, 640, 480]
      min_depth_m: 0.15
      max_depth_m: 1.5
      plane_threshold_m: 0.006
      min_object_height_m: 0.012
      max_object_height_m: 0.16
      min_component_area_px: 500
      max_component_area_px: 50000
      ransac_iterations: 160
      min_plane_inlier_ratio: 0.35
    grasp:
      rpy: [-3.141, -1.552, 3.141]
      pregrasp_clearance_m: 0.10
      grasp_top_offset_m: -0.02
      lift_clearance_m: 0.12
      local_refine_max_xy_m: 0.025
      min_shape_confidence: 0.78
    hand_grasps:
      block: null
      hexagonal_prism: null
      triangular_prism: null
      cylinder: null
    destinations:
      block:
        approach_pose: null
        place_pose: null
        retreat_pose: null
      hexagonal_prism:
        approach_pose: null
        place_pose: null
        retreat_pose: null
      triangular_prism:
        approach_pose: null
        place_pose: null
        retreat_pose: null
      cylinder:
        approach_pose: null
        place_pose: null
        retreat_pose: null
  observe_vel: 0.15
  fine_vel: 0.05
  preflight: true

safety:
  poll_interval_s: 0.3                  # 后台安全监控轮询间隔
  disable_arm_on_emergency: false       # 紧急情况是否失能机械臂（⚠️ 会掉臂！默认只报警不动作）
  effort_guard_enabled: false           # 力矩绝对值上限急停（默认关；需现场标定阈值后再开）
  effort_guard_threshold: 10.0          # 力矩绝对值上限（Nm，任一关节 |effort| 超过此值触发急停）
  feedback_age_stop_s: 2.0              # 连续超过此值才进入急停确认，避免运动期间假急停
  feedback_fault_confirmations: 4       # 相邻轮询连续异常次数（0.3 s 间隔时约 1.2 s）

debug:
  dump_enabled: false                   # ★ 任务执行时落盘相机帧（排查用）；正式赛建议 false 减开销
  dump_dir: "runtime/debug"             # task1→color/ task2→ocr/ task3→shape/ 的根目录
  depth_vis_dir: "img_vis"              # task3 深度可视化伪彩图目录（→ supcon/img_vis/）

logging:
  level: "INFO"
  file: "runtime/logs/service.log"
